<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Profile — Meridian Air</title>
<style>
:root{--ink:#0A2A43;--ink-soft:#11486B;--paper:#F3FBFD;--paper-dim:#DDF4F7;--brass:#12B8C8;--brass-dim:#74D9E3;--slate:#4E7288;--hairline:#C6E7EE}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);font-family:'Helvetica Neue',Arial,sans-serif;color:var(--ink)}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid var(--hairline);background:var(--paper)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo-text{display:flex;flex-direction:column;line-height:1}
.logo-text .name{font-family:Georgia,serif;font-size:19px}
.logo-text .tag{font-size:9.5px;letter-spacing:.18em;color:var(--brass);text-transform:uppercase;margin-top:2px}
header a.back{font-size:13px;color:var(--slate);text-decoration:none}
header a.back:hover{color:var(--ink)}
.wrap{max-width:760px;margin:0 auto;padding:34px 24px 70px}
.top{display:flex;align-items:center;gap:18px;margin-bottom:26px}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--brass),var(--ink-soft));color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-size:28px}
h1{font-family:Georgia,serif;font-weight:400;font-size:30px}
.badge{display:inline-block;margin-top:6px;font-size:10px;letter-spacing:.12em;font-weight:700;border-radius:999px;padding:4px 10px;color:#fff;background:linear-gradient(135deg,#12B8C8,#11486B)}
.badge.member{background:var(--slate)}
.card{background:#fff;border:1px solid var(--hairline);border-radius:6px;padding:22px 24px;margin-bottom:18px}
.card h2{font-family:Georgia,serif;font-weight:400;font-size:19px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--hairline);font-size:14px}
.row:last-child{border-bottom:none}
.row .k{color:var(--slate)}
.row .v{color:var(--ink);font-weight:600;text-align:right;word-break:break-all}
.bar{height:10px;background:var(--paper-dim);border-radius:999px;overflow:hidden;margin:6px 0 8px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--brass),var(--ink-soft))}
.small{font-size:12.5px;color:var(--slate)}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;font-weight:600;border-radius:4px;padding:10px 18px;cursor:pointer;text-decoration:none;border:1px solid var(--ink)}
.btn.primary{background:var(--ink);color:#fff}
.btn.ghost{background:#fff;color:var(--ink)}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
      <circle cx="13" cy="13" r="12" stroke="#0E2238" stroke-width="1"/>
      <path d="M13 1 V25 M1 13 H25" stroke="#0E2238" stroke-width="0.6" opacity="0.4"/>
      <path d="M13 4 C 18 8, 18 18, 13 22 C 8 18, 8 8, 13 4 Z" stroke="#B8924A" stroke-width="1.1" fill="none"/>
    </svg>
    <span class="logo-text">
      <span class="name">Meridian Air</span>
      <span class="tag">Est. 1962 · Every Longitude</span>
    </span>
  </a>
  <a class="back" href="index.html">← Back to home</a>
</header>

<div class="wrap" id="app"></div>

<script>
(function () {
  var VIP_POINTS = 3000, VIP_DISCOUNT = 10;
  var s = null, db = {};
  try { s = JSON.parse(localStorage.getItem('ma_user')); } catch (e) {}
  try { db = JSON.parse(localStorage.getItem('ma_users')) || {}; } catch (e) {}
  if (!s || !s.email) { location.replace('login.html'); return; }

  var u = db[s.email] || {};
  var pts = Math.max(0, Number(s.points || u.points || 0));
  var isVip = !!s.vip || !!u.vip || pts >= VIP_POINTS;
  var tier = isVip ? 'VIP' : (s.tier || u.tier || 'Member');
  var name = s.name || u.name || 'Member';

  function fmtDate(t) {
    if (!t) return 'Not available';
    var d = new Date(t);
    return isNaN(d) ? 'Not available' : d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  }
  function ageOf(dob) {
    var b = new Date(dob), t = new Date();
    var a = t.getFullYear() - b.getFullYear();
    var m = t.getMonth() - b.getMonth();
    if (m < 0 || (m === 0 && t.getDate() < b.getDate())) a--;
    return a;
  }
  function esc(x) { return String(x).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var dobText = 'Not provided';
  var ageText = 'Not provided';
  if (u.dob) {
    var dd = new Date(u.dob + 'T00:00:00');
    dobText = isNaN(dd) ? u.dob : dd.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
    ageText = ageOf(u.dob) + ' years old';
  }

  var pct = isVip ? 100 : Math.min(100, Math.round(pts / VIP_POINTS * 100));
  var progress = isVip
    ? 'VIP unlocked — ' + VIP_DISCOUNT + '% discount on bookings.'
    : (VIP_POINTS - pts).toLocaleString() + ' more points to unlock VIP and ' + VIP_DISCOUNT + '% off.';

  document.getElementById('app').innerHTML =
    '<div class="top"><div class="avatar">' + esc(name.charAt(0).toUpperCase()) + '</div>' +
    '<div><h1>' + esc(name) + '</h1><span class="badge ' + (isVip ? '' : 'member') + '">' + esc(tier.toUpperCase()) + '</span></div></div>' +

    '<div class="card"><h2>Personal information</h2>' +
    '<div class="row"><span class="k">Full name</span><span class="v">' + esc(name) + '</span></div>' +
    '<div class="row"><span class="k">Email</span><span class="v">' + esc(s.email) + '</span></div>' +
    '<div class="row"><span class="k">Date of birth</span><span class="v">' + esc(dobText) + '</span></div>' +
    '<div class="row"><span class="k">Age</span><span class="v">' + esc(ageText) + '</span></div>' +
    '<div class="row"><span class="k">Member since</span><span class="v">' + fmtDate(u.created) + '</span></div></div>' +

    '<div class="card"><h2>Membership</h2>' +
    '<div class="row"><span class="k">Rank</span><span class="v">' + esc(tier) + '</span></div>' +
    '<div class="row"><span class="k">Points</span><span class="v">' + pts.toLocaleString() + '</span></div>' +
    '<div class="row"><span class="k">VIP discount</span><span class="v">' + (isVip ? VIP_DISCOUNT + '% active' : 'Not active') + '</span></div>' +
    '<div style="margin-top:14px"><div class="bar"><div style="width:' + pct + '%"></div></div>' +
    '<div class="small">' + pts.toLocaleString() + ' / ' + VIP_POINTS.toLocaleString() + ' points · ' + progress + '</div></div></div>' +

    '<div class="actions"><a class="btn primary" href="index.html">Book a flight</a>' +
    '<button class="btn ghost" id="out" type="button">Log out</button></div>';

  document.getElementById('out').onclick = function () {
    localStorage.removeItem('ma_user');
    location.href = 'index.html';
  };
})();
</script>
</body>
</html>
