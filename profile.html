<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Profile — Meridian Air</title>
<style>
:root{--ink:#0A2A43;--ink-soft:#11486B;--paper:#F3FBFD;--paper-dim:#DDF4F7;--brass:#12B8C8;--brass-dim:#74D9E3;--slate:#4E7288;--hairline:#C6E7EE}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);font-family:'Helvetica Neue',Arial,sans-serif;color:var(--ink)}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;background:#0A2A43}
.logo{display:flex;align-items:center;gap:14px;text-decoration:none}
.logo-name{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:28px;color:#fff;letter-spacing:.01em;line-height:1}
header a.back{font-size:13px;color:var(--brass-dim);text-decoration:none}header a.back:hover{color:#fff}
.wrap{max-width:900px;margin:0 auto;padding:34px 24px 70px}.top{display:flex;align-items:center;gap:18px;margin-bottom:26px}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--brass),var(--ink-soft));color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-size:28px}
h1{font-family:Georgia,serif;font-weight:400;font-size:30px}.badge{display:inline-block;margin-top:6px;font-size:10px;letter-spacing:.12em;font-weight:700;border-radius:999px;padding:4px 10px;color:#fff;background:linear-gradient(135deg,#12B8C8,#11486B)}
.card{background:#fff;border:1px solid var(--hairline);border-radius:6px;padding:22px 24px;margin-bottom:18px}.card h2{font-family:Georgia,serif;font-weight:400;font-size:19px;margin-bottom:14px}
.card.warn{border:2px solid #D92D20;background:#FEF3F2}.card.warn h2{color:#912018}
.dob-in{font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--hairline);border-radius:4px;color:var(--ink);background:#fff}
.row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--hairline);font-size:14px}.row:last-child{border-bottom:none}.row .k{color:var(--slate)}.row .v{color:var(--ink);font-weight:600;text-align:right;word-break:break-all}
.bar{height:10px;background:var(--paper-dim);border-radius:999px;overflow:hidden;margin:6px 0 8px}.bar>div{height:100%;background:linear-gradient(90deg,var(--brass),var(--ink-soft))}.small{font-size:12.5px;color:var(--slate)}
.tier{display:flex;gap:14px;align-items:flex-start;padding:14px 14px;border:1px solid var(--hairline);border-radius:6px;margin-bottom:10px;background:#fff}.tier .n{width:30px;height:30px;border-radius:50%;background:var(--paper-dim);color:var(--ink-soft);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}.tier .t{font-family:Georgia,serif;font-size:17px}.tier .req{font-size:12px;color:var(--slate);margin:2px 0 4px}.tier .ben{font-size:13px;color:var(--ink)}.tier.done{opacity:.75}.tier.done .n{background:var(--brass);color:#fff}.tier.cur{border:2px solid var(--brass);background:var(--paper)}.tier.cur .n{background:var(--ink-soft);color:#fff}.here{display:inline-block;margin-left:8px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:10px;letter-spacing:.1em;font-weight:700;color:#fff;background:var(--ink-soft);border-radius:999px;padding:3px 8px;vertical-align:middle}
.vip-list{margin:0;padding-left:20px;color:var(--ink);font-size:13px;line-height:1.75}.vip-list strong{color:var(--ink-soft)}.actions{display:flex;gap:12px;flex-wrap:wrap}.btn{font:inherit;font-size:13px;font-weight:600;border-radius:4px;padding:10px 18px;cursor:pointer;text-decoration:none;border:1px solid var(--ink)}.btn.primary{background:var(--ink);color:#fff}.btn.ghost{background:#fff;color:var(--ink)}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html" aria-label="Meridian Air home">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" aria-hidden="true">
      <circle cx="22" cy="22" r="20" stroke="#1FB5C6" stroke-width="2.5"/>
      <path d="M11 26 L22 14 L33 26" stroke="#1FB5C6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15.5 29.5 L22 22.5 L28.5 29.5" stroke="#1FB5C6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-name">Meridian Air</span>
  </a>
  <a class="back" href="index.html">← Back to home</a>
</header>
<div class="wrap" id="app"></div>
<script src="booking.js"></script>
<script src="dashboard.js"></script>
<script>
(function () {
  var VIP_DISCOUNT = 10, MIN_AGE = 18, GRACE_DAYS = 7, DAY = 86400000;
  var VIP_REQUIREMENTS = 'Invitation after 150 completed Meridian Air flights, over 1,000 Meridian Air flying hours, and 5 completed First Class bookings';
  var TIERS = [
    { name:'Waypoint', pts:0, req:'Free signup', benefit:'Member pricing, booking history, earn Meridian Points' },
    { name:'Horizon', pts:5000, req:'5,000 annual points', benefit:'Priority seat selection, 10% points bonus' },
    { name:'Summit', pts:15000, req:'15,000 annual points', benefit:'Priority boarding, one free checked bag' },
    { name:'Apex', pts:35000, req:'35,000 annual points', benefit:'Lounge passes, 25% points bonus, priority rebooking' },
    { name:'Northstar', pts:75000, req:'75,000 annual points', benefit:'Upgrade priority, lounge access, 50% points bonus' },
    { name:'VIP', pts:null, req:VIP_REQUIREMENTS, benefit:'Top upgrade priority, complimentary changes, private check-in, lounge access with one guest, ' + VIP_DISCOUNT + '% booking discount' }
  ];
  var s=null,db={};try{s=JSON.parse(localStorage.getItem('ma_user'))}catch(e){}try{db=JSON.parse(localStorage.getItem('ma_users'))||{}}catch(e){}
  if(!s||!s.email){location.replace('login.html');return}
  function ageOf(dob){var b=new Date(dob+'T00:00:00'),t=new Date(),a=t.getFullYear()-b.getFullYear(),m=t.getMonth()-b.getMonth();if(m<0||(m===0&&t.getDate()<b.getDate()))a--;return a}
  var u=db[s.email]||{};
  if(u.dob&&ageOf(u.dob)<MIN_AGE){localStorage.removeItem('ma_user');location.replace('login.html?banned=1');return}
  if(db[s.email]&&!u.dob){
    if(!u.dobDeadline){u.dobDeadline=Date.now()+GRACE_DAYS*DAY;db[s.email]=u;localStorage.setItem('ma_users',JSON.stringify(db))}
    if(Date.now()>u.dobDeadline){localStorage.removeItem('ma_user');location.replace('login.html?verify=1');return}
  }
  var pts=Math.max(0,Number(s.points||u.points||0)),isVip=!!s.vip||!!u.vip,name=s.name||u.name||'Member';
  var idx=0;for(var i=0;i<5;i++){if(pts>=TIERS[i].pts)idx=i}if(isVip)idx=5;var cur=TIERS[idx];
  function esc(x){return String(x).replace(/[&<>\"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function fmtDate(t){if(!t)return'Not available';var d=new Date(t);return isNaN(d)?'Not available':d.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}
  var dobText='Not provided',ageText='Not provided';if(u.dob){var dd=new Date(u.dob+'T00:00:00');dobText=isNaN(dd)?u.dob:dd.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});ageText=ageOf(u.dob)+' years old'}
  var dobCard='';
  if(db[s.email]&&!u.dob){
    var days=Math.max(1,Math.ceil((u.dobDeadline-Date.now())/DAY));
    dobCard='<div class="card warn"><h2>Verify your date of birth</h2><p class="small">Members must be 18 or older. Add your date of birth within '+days+' day'+(days===1?'':'s')+' or your account will be put on hold until you do.</p><div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap"><input class="dob-in" id="dobIn" type="date" max="'+new Date().toISOString().slice(0,10)+'" /><button class="btn primary" id="dobSave" type="button">Save date of birth</button></div><p class="small" id="dobMsg" style="color:#B42318;margin-top:8px;min-height:16px"></p></div>';
  }
  var progressHtml;if(isVip){progressHtml='<div class="small">You hold the top rank, VIP. Enjoy your '+VIP_DISCOUNT+'% booking discount.</div>'}else if(idx<4){var nxt=TIERS[idx+1],base=TIERS[idx].pts,pct=Math.min(100,Math.round((pts-base)/(nxt.pts-base)*100));progressHtml='<div class="bar"><div style="width:'+pct+'%"></div></div><div class="small">'+pts.toLocaleString()+' points · '+(nxt.pts-pts).toLocaleString()+' more to reach '+nxt.name+'. VIP is not earned with points.</div>'}else{progressHtml='<div class="bar"><div style="width:100%"></div></div><div class="small">You have reached Northstar, the highest points-based rank. VIP requires an invitation after meeting the travel requirements below.</div>'}
  var ladder=TIERS.map(function(t,i){var cls=i===idx?'cur':(i<idx?'done':'');return '<div class="tier '+cls+'"><div class="n">'+(i+1)+'</div><div><div class="t">'+t.name+(i===idx?'<span class="here">YOU ARE HERE</span>':'')+'</div><div class="req">'+t.req+'</div><div class="ben">'+t.benefit+'</div></div></div>'}).join('');
  var dash='';try{dash=maBuildDashboard({name:name,email:s.email,pts:pts,isVip:isVip,tiers:TIERS,idx:idx})}catch(e){dash=''}
  document.getElementById('app').innerHTML=dobCard+dash+'<div class="top"><div class="avatar">'+esc(name.charAt(0).toUpperCase())+'</div><div><h1>'+esc(name)+'</h1><span class="badge">'+esc(cur.name.toUpperCase())+'</span></div></div>'+
    '<div class="card"><h2>Account information</h2><div class="row"><span class="k">Full name</span><span class="v">'+esc(name)+'</span></div><div class="row"><span class="k">Email</span><span class="v">'+esc(s.email)+'</span></div><div class="row"><span class="k">Date of birth</span><span class="v">'+esc(dobText)+'</span></div><div class="row"><span class="k">Age</span><span class="v">'+esc(ageText)+'</span></div><div class="row"><span class="k">Member since</span><span class="v">'+fmtDate(u.created)+'</span></div></div>'+
    '<div class="card"><h2>Your rank</h2><div class="row"><span class="k">Current rank</span><span class="v">'+esc(cur.name)+'</span></div><div class="row"><span class="k">Points</span><span class="v">'+pts.toLocaleString()+'</span></div><div class="row"><span class="k">VIP discount</span><span class="v">'+(isVip?VIP_DISCOUNT+'% active':'Not active')+'</span></div><div style="margin-top:14px">'+progressHtml+'</div></div>'+
    '<div class="card"><h2>VIP invitation requirements</h2><p class="small" style="margin-bottom:10px">VIP is invitation-only and is never unlocked by earning points.</p><ul class="vip-list"><li><strong>150 completed flights</strong> with Meridian Air</li><li><strong>More than 1,000 flying hours</strong> with Meridian Air</li><li><strong>5 completed First Class bookings</strong></li></ul></div>'+
    '<div class="card"><h2>All ranks</h2>'+ladder+'</div><div class="actions"><a class="btn primary" href="index.html">Book a flight</a><button class="btn ghost" id="out" type="button">Log out</button></div>';
  document.getElementById('out').onclick=function(){localStorage.removeItem('ma_user');location.href='index.html'};
  var sv=document.getElementById('dobSave');
  if(sv){sv.onclick=function(){
    var v=document.getElementById('dobIn').value,m=document.getElementById('dobMsg');
    if(!v||isNaN(new Date(v+'T00:00:00'))||ageOf(v)<0){m.textContent='Enter a valid date of birth.';return}
    u.dob=v;delete u.dobDeadline;db[s.email]=u;localStorage.setItem('ma_users',JSON.stringify(db));
    if(ageOf(v)<MIN_AGE){localStorage.removeItem('ma_user');location.href='login.html?banned=1';return}
    location.reload();
  }}
})();
</script>
</body>
</html>
